name: Build APK

# يبدأ البناء عند رفع تغييرات، أو يدوياً من تبويب Actions
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: تثبيت الأدوات
        run: npm install

      - name: نسخ خط Cairo إلى داخل التطبيق
        continue-on-error: true
        run: |
          mkdir -p www/fonts
          cp node_modules/@fontsource/cairo/files/cairo-arabic-*-normal.woff2 www/fonts/

      - name: إنشاء مشروع أندرويد
        run: |
          npx cap add android
          npx cap sync android

      - name: السماح بالكاميرا لمسح QR
        run: sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <application#' android/app/src/main/AndroidManifest.xml

      - name: بناء ملف APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: book-organizer-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
